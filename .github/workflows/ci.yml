name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    
    - name: Verify correctness driver contracts
      run: python3 -m unittest discover -s scripts -p test_verify.py

    - name: Prepare PostgreSQL image on the native contract daemon
      run: docker --host "$DOCKER_HOST" pull postgres:16-alpine

    - name: Verify fast and native correctness lanes
      run: python3 scripts/verify.py all --output artifacts/verification/ci

    - name: Retain correctness results and stalled-phase diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: correctness-evidence
        path: artifacts/verification
        if-no-files-found: error

    - name: Pack
      run: dotnet pack --no-build --configuration Release --output nupkgs
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nupkgs
        path: nupkgs/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v7

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: nupkgs
        path: nupkgs
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    
    - name: Publish to NuGet
      run: dotnet nuget push "nupkgs/*.nupkg" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
