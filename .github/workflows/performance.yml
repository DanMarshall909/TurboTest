name: Pool performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache PostgreSQL image before timed startup
        run: docker pull postgres:16-alpine
      - name: Run repeated public-API experiment
        run: dotnet run -c Release --project benchmarks/TurboTest.Benchmarks -- --output artifacts/pool-benchmarks/experiment --blocks 2 --samples 2 --seed 20261015 --idle-ms 2000
      - name: Retain complete and rejected results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pool-performance
          path: artifacts/pool-benchmarks/experiment
          if-no-files-found: error
